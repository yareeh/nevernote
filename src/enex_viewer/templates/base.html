<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Notes{% endblock %} · Nevernote archive</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/nevernote.png" alt="nevernote" width="117" height="32"></a>
    <form class="search" action="/search" role="search">
      <input type="search" name="q" value="{{ q }}" placeholder="Search notes"
             aria-label="Search notes" autocomplete="off">
    </form>
  </header>
  {% block main %}{% endblock %}
  <script src="/static/app.js"></script>
</body>
</html>
