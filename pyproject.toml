[project]
name = "enex-viewer"
version = "0.1.0"
description = "Read-only web viewer and API for Evernote ENEX exports"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "nh3>=0.3.7",
    "uvicorn>=0.53.0",
]

[project.scripts]
enex-viewer = "enex_viewer.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "lxml-stubs>=0.5.1",
    "playwright>=1.63.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
backup = [
    "evernote-backup==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enex_viewer"]

[tool.uv]
default-groups = ["dev", "backup"]
# evernote-backup 1.14.0 pins these exactly to vulnerable versions:
#   thrift 0.21.0: CVE-2026-66053 (TLS host mismatch), CVE-2026-43871,
#                  CVE-2026-41608 -> fixed in 0.24.0
#   click 8.1.8:   CVE-2026-7246 (click.edit command injection) -> 8.3.3
# thrift 0.24.0 breaks evernote-backup's bundled-CA path ("certfile should be
# a valid filesystem path"), so the Makefile passes --use-system-ssl-ca.
# Verified with a real sync and export. Drop once upstream updates.
override-dependencies = [
    "thrift>=0.24.0",
    "click>=8.3.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["enex_viewer", "enexgen"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
