name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ruff format/lint, pyright (strict), pytest. The runner image ships
      # Google Chrome, so the Playwright browser tests run here too.
      - name: make check
        run: make check

      # Known CVEs in any locked dependency (runtime, dev and backup groups)
      # fail the build.
      - name: make audit
        run: make audit

      # The viewer's container image must keep building (make viewer-up uses
      # rootless Podman locally; the runner has Docker).
      - name: Build container image
        run: docker build --tag nevernote-viewer:ci .
